name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # for the GitHub Release
      id-token: write # for npm publish --provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Derive version from tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing dahmer v$version"

      - name: Stamp version into npm/dahmer/package.json
        run: |
          v="${{ steps.ver.outputs.version }}"
          node -e "
            const fs=require('fs'),p='npm/dahmer/package.json';
            const j=JSON.parse(fs.readFileSync(p));
            j.version='$v';
            for (const k of Object.keys(j.optionalDependencies||{})) {
              j.optionalDependencies[k]='$v';
            }
            fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          "

      - name: Cross-compile all platforms and stage npm packages
        run: bash scripts/build-npm.sh
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Publish per-platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for d in npm/dahmer-*/; do
            echo "::group::publish $d"
            (cd "$d" && npm publish --access public --provenance)
            echo "::endgroup::"
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm/dahmer
          npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            npm/dahmer-darwin-arm64/bin/dahmer
            npm/dahmer-darwin-x64/bin/dahmer
            npm/dahmer-linux-arm64/bin/dahmer
            npm/dahmer-linux-x64/bin/dahmer
            npm/dahmer-win32-arm64/bin/dahmer.exe
            npm/dahmer-win32-x64/bin/dahmer.exe
